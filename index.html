<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APOSTOLGRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fafafa; --card:#fff; --border:#dbdbdb; --text:#262626; --text2:#8e8e8e;
  --blue:#0095f6; --red:#ff3040; --chip:#efefef; --hover:#f2f2f2;
  --overlay:rgba(0,0,0,.7); --link:#00376b;
}
body.dark{
  --bg:#000; --card:#000; --border:#262626; --text:#f5f5f5; --text2:#a8a8a8;
  --chip:#262626; --hover:#1a1a1a; --overlay:rgba(10,10,10,.8); --link:#e0f1ff;
}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e6e6e8;color:var(--text);transition:background .25s}
body.dark{background:#0a0a0a}
button{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);position:relative;padding-bottom:62px}
@media (max-width:480px){ .app{border:0} body{background:var(--bg)} }

/* ===== верхня панель ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px}
.logo .word{font-family:'Grand Hotel',cursive;font-size:28px;line-height:1;transform:translateY(-2px)}
.ticons{display:flex;gap:18px;align-items:center}
.ticons button{background:none;border:0;color:var(--text);cursor:pointer;display:flex;padding:0;position:relative}
.bdot{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

/* ===== нижня навігація ===== */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:52px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:20}
.bnav button{flex:1;background:none;border:0;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bnav button.on{color:var(--text)}
.navava{width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid transparent}
.navava.on{border-color:var(--text)}
.navava svg{display:block;width:100%;height:100%}

/* ===== аватарки та кільця ===== */
.ring{border-radius:50%;padding:2.5px;background:conic-gradient(from 210deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.ring.seen{background:var(--border)}
.ring>div{border-radius:50%;border:2.5px solid var(--card);overflow:hidden;background:var(--card);width:100%;height:100%}
.ring svg{display:block;width:100%;height:100%}
.ring{width:64px;height:64px}
.ring.sm{width:38px;height:38px}
.ring.xsm{width:34px;height:34px}

/* ===== лента ===== */
.strow{display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.strow::-webkit-scrollbar{display:none}
.st{text-align:center;cursor:pointer;flex:none}
.st .lbl{font-size:11px;margin-top:5px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.post{border-bottom:1px solid var(--border);padding-bottom:10px;background:var(--card)}
.phead2{display:flex;align-items:center;gap:10px;padding:10px 14px}
.phead2 .av{cursor:pointer}
.pinfo{flex:1;line-height:1.3}
.pinfo b{font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.pinfo .loc{display:block;font-size:11px;color:var(--text2)}
.dots{background:none;border:0;color:var(--text);cursor:pointer;display:flex}
.pimg{position:relative;user-select:none;touch-action:manipulation}
.pimg svg{width:100%;display:block}
.bigheart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.bigheart svg{width:92px;height:92px;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.45));transform:scale(0);opacity:0}
.bigheart.pop svg{animation:heartpop .9s ease forwards}
@keyframes heartpop{0%{transform:scale(0);opacity:0}25%{transform:scale(1.2);opacity:1}45%{transform:scale(.95)}60%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
.pacts{display:flex;align-items:center;gap:14px;padding:8px 14px 2px}
.pacts button{background:none;border:0;color:var(--text);cursor:pointer;display:flex;padding:0}
.pacts button.like.on{color:var(--red)}
.pacts button.pop svg{animation:likepop .35s ease}
@keyframes likepop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pacts .spacer{flex:1}
.plikes{padding:3px 14px 0;font-size:13px;font-weight:600}
.pcap{padding:2px 14px;font-size:13px;line-height:1.45}
.pcap b{cursor:pointer}
.pview{padding:2px 14px;font-size:13px;color:var(--text2);cursor:pointer}
.pcom{padding:1px 14px;font-size:13px;line-height:1.55}
.ptime{padding:4px 14px 0;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 14px 2px;border-top:1px solid var(--border);margin-top:9px}
.cava{width:26px;height:26px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.crow input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:13px;outline:none}
.crow input::placeholder{color:var(--text2)}
.postbtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer}
.end{text-align:center;color:var(--text2);font-size:12px;padding:26px 0 30px;line-height:1.8}
.end span{font-size:11px;opacity:.8}

/* ===== профіль ===== */
.phead{padding:22px 16px 8px}
.prow{display:flex;align-items:center;gap:26px}
.pavatar{width:88px;flex:none}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:16px}
.stats span{font-size:12px;color:var(--text2)}
.puname{font-weight:700;font-size:16px;margin-top:14px;display:flex;align-items:center;gap:5px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:32px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--chip);color:var(--text);cursor:pointer}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff}
.btn.icon{flex:0 0 32px;display:flex;align-items:center;justify-content:center}
.bio{margin-top:12px;font-size:13px;line-height:1.55}
.bio .cat{color:var(--text2);font-size:12px}
.bio .nm{font-weight:600;margin:2px 0}
.bio .lnk{color:var(--link);font-weight:600;margin-top:2px}
.highlights{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none}
.highlights::-webkit-scrollbar{display:none}
.hl{text-align:center;cursor:pointer;flex:none}
.hl .ring2{width:62px;height:62px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card)}
.hl span{display:block;font-size:11px;margin-top:5px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptabs{display:flex;border-top:1px solid var(--border);margin-top:14px}
.ptabs button{flex:1;height:44px;background:none;border:0;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-top:1px solid transparent;margin-top:-1px}
.ptabs button.on{color:var(--text);border-top:1px solid var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px 0}
.gcell{position:relative;aspect-ratio:1;cursor:pointer;overflow:hidden}
.gcell svg{width:100%;height:100%;display:block}
.gcell .ov{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;display:flex;align-items:center;justify-content:center;gap:16px;color:#fff;font-weight:700;font-size:13px;transition:opacity .15s}
.gcell:hover .ov{opacity:1}

/* ===== пошук / сповіщення ===== */
.shead{padding:12px 14px}
.shead input{width:100%;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--chip);padding:0 14px;font-size:14px;color:var(--text);outline:none}
.urow{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}
.urow:hover{background:var(--hover)}
.urow .un{font-size:13px;font-weight:600}
.urow .nm{font-size:13px;color:var(--text2)}
.uava{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
.uava svg{width:100%;height:100%;display:block}
.emoji{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.nrow{display:flex;gap:12px;padding:12px 14px;align-items:center;font-size:13px;line-height:1.45}
.nrow .t{color:var(--text2);margin-left:auto;flex:none}

/* ===== модалка поста ===== */
.modal{position:fixed;inset:0;z-index:50;background:var(--overlay);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.xbtn{position:absolute;top:12px;right:12px;background:none;border:0;color:#fff;cursor:pointer;z-index:2;display:flex;padding:6px}
.mcard{background:var(--card);width:100%;max-width:480px;max-height:93dvh;overflow-y:auto;border-radius:14px 14px 0 0;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* ===== сторіс ===== */
.story{position:fixed;inset:0;z-index:60;background:#000;display:none}
.story.open{display:block}
.sprog{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:5}
.sprog i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;display:block}
.sprog i b{display:block;height:100%;width:0;background:#fff}
.sshade{position:absolute;top:0;left:0;right:0;height:95px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3;pointer-events:none}
.shead3{position:absolute;top:22px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:5;color:#fff}
.sava{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(255,255,255,.7)}
.sava svg{width:100%;height:100%;display:block}
.shead3 .stime{font-size:12px;opacity:.8}
.sx{background:none;border:0;color:#fff;cursor:pointer;display:flex}
.simg{position:absolute;inset:0}
.simg svg{width:100%;height:100%}
.stext{position:absolute;bottom:56px;left:0;right:0;text-align:center;color:#fff;font-size:16px;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.7);padding:0 28px;z-index:5;line-height:1.5}
.szl,.szr{position:absolute;top:0;bottom:0;width:35%;z-index:4;cursor:pointer}
.szl{left:0}.szr{right:0}

/* ===== шіт ===== */
.sheet{position:fixed;inset:0;z-index:55;background:var(--overlay);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .inner{width:100%;max-width:480px;background:var(--card);border-radius:14px 14px 0 0;padding:6px 0 18px;animation:up .2s ease}
.sheet .title{text-align:center;font-size:12px;color:var(--text2);padding:10px 0}
.acct{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.acct:hover,.acct.cur{background:var(--hover)}
.acct .un{font-size:14px;font-weight:600}
.acct .nm{font-size:12px;color:var(--text2)}
.acct .chk{margin-left:auto;color:var(--blue)}
.sheet .cancel{border-top:1px solid var(--border);margin-top:8px;padding:14px;text-align:center;font-weight:600;font-size:14px;cursor:pointer}

/* ===== тост ===== */
#toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%) translateY(20px);background:#262626;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
body.dark #toast{background:#363636;border:1px solid #444}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo" id="logoBox"></div>
    <div class="ticons">
      <button id="themeBtn" data-act="theme" title="Тема"></button>
      <button data-act="toast" data-arg="Пошта: вашого голуба відправлено 🕊️" id="planeBtn"></button>
      <button data-act="nav" data-arg="notifs" id="notifBtn"><span class="bdot" id="bdot"></span></button>
    </div>
  </header>
  <main id="screen"></main>
  <nav class="bnav" id="bnav"></nav>
</div>

<div class="modal" id="postModal"></div>
<div class="story" id="storyViewer"></div>
<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div id="toast"></div>

<script>
/* ======================= ІКОНКИ ======================= */
const svgWrap=(inner,w=24)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const heartPath='M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z';
const heartSvg=f=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${heartPath}"/></svg>`;
const bigHeartSvg=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="${heartPath}"/></svg>`;
const bmSvg=f=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const I={
  home:svgWrap('<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9.5"/>'),
  homeFill:`<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2.2 2.4 10.3h2.6V21h5.6v-6.2h2.8V21h5.6V10.3h2.6Z"/></svg>`,
  search:svgWrap('<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/>'),
  plus:svgWrap('<rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M12 8v8M8 12h8"/>'),
  reels:svgWrap('<rect x="2.5" y="2.5" width="19" height="19" rx="4.5"/><path d="M2.5 8.5h19M8.2 2.5l2.8 6M15.8 2.5l-2.8 6"/><path d="M10.6 12.2 15 14.9l-4.4 2.7Z" fill="currentColor" stroke="none"/>'),
  comment:svgWrap('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'),
  send:svgWrap('<line x1="21.5" y1="2.5" x2="11" y2="13"/><path d="M21.5 2.5 14.5 21.5l-3.5-8.5-8.5-3.5Z"/>'),
  dots:`<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
  grid:svgWrap('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',22),
  tag:svgWrap('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="9.8" r="3"/><path d="M6.5 19c.8-3 3-4.4 5.5-4.4s4.7 1.4 5.5 4.4"/>',22),
  x:svgWrap('<path d="M6 6l12 12M18 6 6 18"/>',22),
  moon:svgWrap('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>',22),
  sun:svgWrap('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',22),
};
const badge=`<svg width="13" height="13" viewBox="0 0 24 24" style="flex:none"><circle cx="12" cy="12" r="11" fill="#0095f6"/><path d="m7.4 12.4 3 3 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const logoGlyph=`<svg width="27" height="27" viewBox="0 0 48 48"><defs><linearGradient id="lgg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".3" stop-color="#fa7e1e"/><stop offset=".55" stop-color="#d62976"/><stop offset=".8" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="4" y="4" width="40" height="40" rx="12" fill="none" stroke="url(#lgg)" stroke-width="4.5"/><circle cx="24" cy="24" r="9.5" fill="none" stroke="url(#lgg)" stroke-width="4.5"/><circle cx="35" cy="13" r="3" fill="url(#lgg)"/></svg>`;

/* ======================= SVG-ХЕЛПЕРИ ======================= */
const coin=(x,y,r=9)=>`<g transform="translate(${x} ${y})"><circle r="${r}" fill="#cfd6dd" stroke="#98a2ac" stroke-width="1.5"/><circle r="${(r*0.6).toFixed(1)}" fill="none" stroke="#aab4bd" stroke-width="1.3"/><rect x="-1.1" y="${(-r*0.45).toFixed(1)}" width="2.2" height="${(r*0.9).toFixed(1)}" fill="#98a2ac"/></g>`;
const spark=(x,y,s=6,c='#ffd76b')=>`<path d="M${x} ${y-s} L${(x+s*0.28).toFixed(1)} ${(y-s*0.28).toFixed(1)} L${x+s} ${y} L${(x+s*0.28).toFixed(1)} ${(y+s*0.28).toFixed(1)} L${x} ${y+s} L${(x-s*0.28).toFixed(1)} ${(y+s*0.28).toFixed(1)} L${x-s} ${y} L${(x-s*0.28).toFixed(1)} ${(y-s*0.28).toFixed(1)} Z" fill="${c}"/>`;
const ap=(x,robe,hair='#4a3524',halo=false,big=false)=>{
  const r=big?17:14, hy=big?228:230;
  return `<g>${halo?`<circle cx="${x}" cy="${hy}" r="21" fill="none" stroke="#e9c25c" stroke-width="4"/>`:''}`
    +`<rect x="${x-(big?19:15)}" y="238" width="${big?38:30}" height="70" rx="13" fill="${robe}"/>`
    +`<circle cx="${x}" cy="${hy}" r="${r}" fill="#efc09a"/>`
    +`<path d="M${x-r} ${hy-2} Q${x-r} ${hy-r-8} ${x} ${hy-r-10} Q${x+r} ${hy-r-8} ${x+r} ${hy-2} Q${x+r-5} ${hy-r+4} ${x} ${hy-r+4} Q${x-r+5} ${hy-r+4} ${x-r} ${hy-2} Z" fill="${hair}"/></g>`;
};
const cup=x=>`<path d="M${x-8} 256 h16 l-4 11 h-8 Z" fill="#d9a53c"/><rect x="${x-1.5}" y="267" width="3" height="9" fill="#d9a53c"/><ellipse cx="${x}" cy="277" rx="7" ry="2.4" fill="#d9a53c"/>`;
const bread=(x,y=298)=>`<ellipse cx="${x}" cy="${y}" rx="11" ry="5.5" fill="#dba75f"/><ellipse cx="${x}" cy="${y-2}" rx="7" ry="3" fill="#efc98d"/>`;
const candle=x=>`<rect x="${x-2}" y="226" width="4" height="24" fill="#f4ead6"/><ellipse cx="${x}" cy="219" rx="3" ry="5" fill="#f5b942"/><ellipse cx="${x}" cy="221" rx="1.5" ry="2.6" fill="#fdeec0"/>`;

/* ======================= КАРТИНКИ ПОСТІВ ======================= */
function supperImg(){
  const robes=['#5b7ea3','#7a5a8c','#4f7d5c','#a3653a','#8a4a4a','#c9a227','#a33b3b','#4f7d5c','#7a5a8c','#5b7ea3','#6a6f4a','#a3653a','#5a4a7a'];
  let figs='';
  for(let i=0;i<13;i++){const x=Math.round(42+i*26.3); figs+=ap(x,robes[i], i%2?'#2f2318':'#4a3524', i===6, i===6);}
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#eadcc0"/><rect width="400" height="16" fill="#d9c8a4"/>

    {e:'🏝️',c:'#2f7d6d',h:'<b>patmos.travel</b>: «Приїжджайте — у нас фіолетові заходи»',t:'2 д'}
  ];
  return `<div class="shead"><b style="font-size:15px">Сповіщення</b></div>`+
  items.map(i=>`<div class="nrow">${i.av?`<div class="uava">${i.av}</div>`:`<div class="emoji" style="background:${i.c}">${i.e}</div>`}<div>${i.h}</div><div class="t">${i.t}</div></div>`).join('');
}
function render(){
  screenEl.innerHTML=S.screen==='feed'?feedHtml():S.screen==='search'?searchHtml():S.screen==='notifs'?notifsHtml():profileHtml(S.profile);
  document.querySelectorAll('#bnav [data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.screen));
  $('navprof').innerHTML=`<div class="navava ${S.screen==='profile'?'on':''}">${P[S.profile].avatar}</div>`;
}

/* ======================= ЛОГІКА ======================= */
let toastTimer;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}
function setLike(id,val){
  const p=postById(id); if(val===undefined) val=!S.liked.has(id);
  if(val===S.liked.has(id)) return;
  val?S.liked.add(id):S.liked.delete(id);
  document.querySelectorAll(`[data-likes-for="${id}"]`).forEach(el=>el.textContent='Подобається: '+fmt(p.likes+(S.liked.has(id)?1:0)));
  document.querySelectorAll(`[data-heart="${id}"]`).forEach(el=>{el.classList.toggle('on',S.liked.has(id));el.innerHTML=heartSvg(S.liked.has(id));});
}
function setSave(id){
  const on=!S.saved.has(id); on?S.saved.add(id):S.saved.delete(id);
  document.querySelectorAll(`[data-saveicon="${id}"]`).forEach(el=>el.innerHTML=bmSvg(on));
  toast(on?'Збережено у «Вибране» 🔖':'Видалено з «Вибраного»');
}
function toggleFollow(k){
  S.follows[k]=!S.follows[k];
  render();
  toast(S.follows[k]?(k==='john'?'Ви підписалися ✝️ +1 підписник':'Ви підписалися. Він чомусь одразу рахує прибуток 🤑'):'Ви відписалися');
}
function submitComment(id){
  const inputs=[...document.querySelectorAll(`[data-cinput="${id}"]`)];
  const val=inputs.map(i=>i.value.trim()).find(v=>v);
  if(!val) return;
  postById(id).comments.push({u:'ви',t:val});
  inputs.forEach(i=>i.value='');
  document.querySelectorAll(`[data-comments="${id}"]`).forEach(el=>el.innerHTML=commentsHtml(postById(id),el.dataset.mode));
}
function openPost(id){
  const p=postById(id);
  modalEl.innerHTML=`<button class="xbtn" data-act="close-post">${I.x}</button><div class="mcard">${postInner(p,P[p.owner],true)}</div>`;
  modalEl.classList.add('open');
}
function closePost(){modalEl.classList.remove('open');modalEl.innerHTML='';}

let st={key:null,idx:0,t0:0,raf:null};
function openStories(key){
  S.seen[key]=true;
  document.querySelectorAll(`[data-ring="${key}"]`).forEach(el=>el.classList.add('seen'));
  st.key=key; st.idx=0;
  storyEl.classList.add('open');
  renderStory();
}
function renderStory(){
  const prof=P[st.key], fr=prof.stories[st.idx];
  storyEl.innerHTML=`
  <div class="sprog">${prof.stories.map((_,i)=>`<i><b style="width:${i<st.idx?100:0}%"></b></i>`).join('')}</div>
  <div class="sshade"></div>
  <div class="shead3"><div class="sava">${prof.avatar}</div><b>${prof.username}</b><span class="stime">${st.idx===0?'щойно':'2 год'}</span><span style="flex:1"></span><button class="sx" data-act="close-story">${I.x}</button></div>
  <div class="szl" data-act="story-prev"></div><div class="szr" data-act="story-next"></div>
  <div class="simg">${fr.img}</div>
  <div class="stext">${fr.t}</div>`;
  st.t0=performance.now();
  cancelAnimationFrame(st.raf);
  const tick=now=>{
    const b=storyEl.querySelectorAll('.sprog i b')[st.idx];
    const pr=Math.min(1,(now-st.t0)/5000);
    if(b) b.style.width=(pr*100)+'%';
    if(pr>=1) storyNext(); else st.raf=requestAnimationFrame(tick);
  };
  st.raf=requestAnimationFrame(tick);
}
function storyNext(){const prof=P[st.key]; if(st.idx<prof.stories.length-1){st.idx++;renderStory();}else closeStories();}
function storyPrev(){if(st.idx>0){st.idx--;renderStory();}else st.t0=performance.now();}
function closeStories(){cancelAnimationFrame(st.raf);storyEl.classList.remove('open');}
function openSheet(){
  $('sheetInner').innerHTML=`<div class="title">Змінити акаунт</div>`+
  ['john','judas'].map(k=>`<div class="acct ${S.profile===k?'cur':''}" data-act="pick" data-arg="${k}"><div class="ring xsm" style="width:40px;height:40px"><div>${P[k].avatar}</div></div><div><div class="un">${P[k].username}</div><div class="nm">${P[k].name}</div></div>${S.profile===k?'<span class="chk">✓</span>':''}</div>`).join('')+
  `<div class="acct" data-act="toast" data-arg="Реєстрація відкриється після Хрещення 💧"><div class="emoji" style="background:var(--chip);color:var(--text2);font-size:20px">＋</div><div class="un" style="color:var(--text2)">Додати акаунт</div></div>
  <div class="cancel" data-act="close-sheet">Скасувати</div>`;
  sheetEl.classList.add('open');
}
function closeSheet(){sheetEl.classList.remove('open');}

/* ======================= ПОДІЇ ======================= */
const lastTap={};
document.addEventListener('click',e=>{
  const tp=e.target.closest('[data-tap]');
  if(tp){
    const id=tp.dataset.tap, now=Date.now();
    if(now-(lastTap[id]||0)<350){
      setLike(id,true);
      const bh=tp.querySelector('.bigheart');
      if(bh){bh.classList.remove('pop');void bh.offsetWidth;bh.classList.add('pop');}
      lastTap[id]=0;
    } else lastTap[id]=now;
  }
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const a=t.dataset.act, g=t.dataset.arg;
  if(a==='like'){setLike(g);t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');}
  else if(a==='save')setSave(g);
  else if(a==='nav'){S.screen=g;render();window.scrollTo(0,0);if(g==='notifs'){S.notifSeen=true;const b=$('bdot');if(b)b.style.display='none';}}
  else if(a==='profile'){S.screen='profile';S.profile=g;render();window.scrollTo(0,0);}
  else if(a==='open-post')openPost(g);
  else if(a==='close-post')closePost();
  else if(a==='follow')toggleFollow(g);
  else if(a==='stories')openStories(g);
  else if(a==='close-story')closeStories();
  else if(a==='story-next')storyNext();
  else if(a==='story-prev')storyPrev();
  else if(a==='sheet')openSheet();
  else if(a==='close-sheet')closeSheet();
  else if(a==='pick'){S.profile=g;S.screen='profile';closeSheet();render();window.scrollTo(0,0);}
  else if(a==='fake')toast('Цей профіль приховано до П’ятидесятниці 🕊️');
  else if(a==='submit-comment')submitComment(g);
  else if(a==='toast')toast(g);
  else if(a==='theme'){document.body.classList.toggle('dark');$('themeBtn').innerHTML=document.body.classList.contains('dark')?I.sun:I.moon;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const inp=e.target.closest&&e.target.closest('[data-cinput]');if(inp)submitComment(inp.dataset.cinput);}
  if(e.key==='Escape'){closePost();closeStories();closeSheet();}
});
modalEl.addEventListener('click',e=>{if(e.target===modalEl)closePost();});
sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet();});

/* ======================= ІНІЦІАЛІЗАЦІЯ ======================= */
 $('logoBox').innerHTML=logoGlyph+`<span class="word">Apostolgram</span>`;
 $('themeBtn').innerHTML=I.moon;
 $('planeBtn').innerHTML=I.send;
 $('notifBtn').insertAdjacentHTML('beforeend',I.comment);
 $('notifBtn').querySelector('svg').outerHTML=heartSvg(false);
 $('bnav').innerHTML=`
  <button data-nav="feed" data-act="nav" data-arg="feed">${I.home}</button>
  <button data-nav="search" data-act="nav" data-arg="search">${I.search}</button>
  <button data-act="toast" data-arg="Завантаження недоступне: кам’яні скрижалі не підтримують медіа 📜">${I.plus}</button>
  <button data-nav="notifs" data-act="nav" data-arg="notifs">${heartSvg(false)}</button>
  <button data-act="sheet" id="navprofBtn"><span id="navprof"></span></button>`;
render();
</script>
</body>
</html>
